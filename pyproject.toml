[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dmxreplay"
version = "0.1.0-dev"
description = "DMXReplay: an open, documented format and toolset for recording and replaying DMX lighting shows as lossless, timestamped media."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "DMXReplay contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    # TOML parsing for dmxreplay.config (docs/RASPBERRY_PI.md §14's headless
    # config-file loader). Python 3.11+ has this in the standard library
    # (tomllib) -- tomli is its predecessor/backport, same API, only
    # installed on the older Pythons this project's requires-python floor
    # (3.10) still allows.
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
codec = [
    # PyAV wraps ffmpeg's libavcodec/libavformat; used from Phase 4 onward
    # for FFV1/Matroska container I/O (dmxreplay.codec.video_frame,
    # dmxreplay.container). Not required for dmxreplay.dmx/.clock/.metadata/
    # .network, which have no third-party dependencies at all -- Art-Net and
    # sACN are implemented from scratch (see docs/ARTNET.md, docs/SACN.md).
    "av>=11.0",
]
audio = [
    # Optional hardware audio output (dmxreplay.audio.SoundDeviceAudioSink,
    # Phase 7). Requires the system PortAudio library (e.g. `apt install
    # libportaudio2`) to actually open a device -- NullAudioSink/
    # WavFileAudioSink need neither this nor a sound card.
    "sounddevice>=0.4",
]
control = [
    # dmxreplay.control's HTTP + WebSocket network Control API (cross-
    # platform extension Phase D, docs/API.md §10, docs/MOBILE_API.md).
    # One library for both HTTP and WebSocket -- avoids a separate ASGI
    # server + websockets-library combination for what's a small API
    # surface. Confirmed (docs/ARCHITECTURE.md §1's method, applied again
    # here) to publish prebuilt wheels for win_amd64/win_arm64, macOS
    # (universal2), and Linux aarch64 (manylinux + musllinux) -- the same
    # platform set this project already depends on `av` supporting.
    "aiohttp>=3.9",
]
dev = [
    "pytest>=7.4",
    "jsonschema>=4.19",
    "dmxreplay[codec]",
    "dmxreplay[audio]",
    "dmxreplay[control]",
]

[project.scripts]
dmxreplay-record = "dmxreplay.cli.record:main"
dmxreplay-play = "dmxreplay.cli.play:main"
dmxreplay-info = "dmxreplay.cli.info:main"
dmxreplay-convert = "dmxreplay.cli.convert:main"
dmxreplay-server = "dmxreplay.cli.server:main"

[project.gui-scripts]
# gui-scripts (not scripts): on Windows this launches without an attached
# console window, the correct behavior for a GUI app -- see
# docs/BUILD_AND_DISTRIBUTION.md. Requires Tkinter (python.org installers
# on Windows/macOS ship it; `apt install python3-tk` on Debian/Pi) --
# not part of `dependencies` since it's stdlib, not a pip package.
dmxreplay-player-gui = "dmxreplay.ui.player_app:main"
dmxreplay-recorder-gui = "dmxreplay.ui.recorder_app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
