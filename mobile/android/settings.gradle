// Standard Flutter Android project settings (the "new" flutter-plugin-loader
// style, current since Flutter 3.10ish) -- hand-written here so a developer
// does NOT need to run `flutter create --platforms=android .` first (see
// ../.gitignore's old note, now superseded, and docs/MOBILE.md SS6). Written
// against real, documented Flutter/AGP/Kotlin plugin coordinates, not
// guessed syntax -- but not compiled with a real `flutter`/`gradle` build
// end-to-end in this environment (no Android SDK here); see
// docs/MOBILE.md's Flutter validation status.
pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties. Run 'flutter pub get' once, or set it manually -- see local.properties.example."
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.3.0" apply false
    id "org.jetbrains.kotlin.android" version "1.9.22" apply false
}

include ":app"
