def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after Android/Kotlin.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "org.dmxreplay.controller"
    compileSdk 34
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        // See docs/MOBILE.md SS6 -- matches the macOS/iOS bundle identifier
        // style (org.dmxreplay.*) already used elsewhere in this project.
        applicationId "org.dmxreplay.controller"
        minSdk 21
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            // Signed with the debug keystore for now, so `flutter build
            // apk`/`flutter run --release` produce something installable
            // without a real release keystore already set up. Replace with
            // a real signingConfig (a proper upload keystore) before any
            // Play Store release -- see docs/MOBILE.md.
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source "../.."
}
